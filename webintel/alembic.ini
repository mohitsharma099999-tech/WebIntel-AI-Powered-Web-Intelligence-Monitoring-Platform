# =====================================================================
# Alembic configuration
# =====================================================================
# The URL is intentionally left blank so it can be overridden at runtime
# by env.py reading ALEMBIC_DATABASE_URL / DATABASE_URL from the env.
# =====================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url = driver://user:pass@localhost/dbname
# ^ Uncomment and hard-code ONLY if you don't want env-driven URLs.

# Timestamp-based migration filenames (e.g. 20240101_120000_add_users.py)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Timezone used for the file_template above
timezone = UTC

# Paths to search for revision scripts (for `alembic merge`, `history`, etc.)
# version_locations = %(here)s/alembic/versions

# Truncate the revision slug length if you have long messages
truncate_slug_length = 40

# Reuse the same connection for the whole migration run
# (great for SQLite, generally fine for Postgres too)
# transaction_per_migration = false

# Output encoding
output_encoding = utf-8

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
