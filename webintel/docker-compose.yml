# docker-compose.yml
name: webintel

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-webintel}:${POSTGRES_PASSWORD:-webintel}@postgres:5432/${POSTGRES_DB:-webintel}
  REDIS_URL: redis://redis:6379/0
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  API_KEY: ${API_KEY:-}
  DEBUG: ${DEBUG:-false}
  PYTHONUNBUFFERED: "1"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: webintel:local
    container_name: webintel_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [webintel]

  worker:
    image: webintel:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webintel_worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - backend.app.tasks.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - -Q
      - default
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks: [webintel]

  postgres:
    image: postgres:16-alpine
    container_name: webintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webintel}
      POSTGRES_DB: ${POSTGRES_DB:-webintel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # NOTE: port not exposed to host by default.
    # Uncomment for local psql access:
    # ports: ["5432:5432"]
    networks: [webintel]

  redis:
    image: redis:7-alpine
    container_name: webintel_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # ports: ["6379:6379"]   # uncomment for local access
    networks: [webintel]

volumes:
  postgres_data:
  redis_data:

networks:
  webintel:
    driver: bridge
